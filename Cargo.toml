[workspace]
resolver = "3"
members = ["crates/*"]
# Fuzz targets build with nightly on their own (spec 13).
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
vextor-core = { path = "crates/vextor-core" }
vextor-geom = { path = "crates/vextor-geom" }
vextor-svg = { path = "crates/vextor-svg" }
vextor-render = { path = "crates/vextor-render" }
# Window and UI. `glow` (OpenGL) instead of the default `wgpu` (spec 14
# spike): the canvas is one texture plus egui's own shapes, and wgpu with
# its shader compiler (naga) was a quarter of the binary. `links` and
# `web_screen_reader` are left out: no hyperlinks, no web build.
eframe = { version = "0.37.0", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "glow",
    "system_fonts",
    "wayland",
    "x11",
] }
# Linux only: winit's default backends (X11, Wayland loaded at run time),
# which eframe's own defaults used to turn on. Already in the tree.
winit = "0.30.13"
# Paste (spec 13): the files copied in Finder / Explorer; the version egui
# already uses, without its image support (egui hands over pasted images).
arboard = { version = "3.7.0", default-features = false }
base64 = "0.23.1"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
directories = "6.0.0"
# Compressed `.vxtr` files (spec 14 spike: gzip saves 94 % on the 20 000-node
# fixture); the version png already pulls in, pure-Rust backend, no C.
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
# Text (spec 05c): the versions usvg 0.48 uses, so nothing is duplicated.
fontdb = { version = "0.24.0", default-features = false, features = ["std", "fs"] }
harfrust = "0.12.0"
# Booleans (spec 11 spike): robust polygon overlay; curves are recovered
# from the inputs afterwards (`vextor-geom` `ops`).
i_overlay = { version = "9.1.0", default-features = false }
# Image import (spec 13): sizes read from the file header before decoding;
# the version usvg uses.
imagesize = "0.15.0"
# Canvas images (spec 13): PNG / JPEG / WebP decoding with size limits; the
# version eframe already pulls in through arboard.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
# SVG export snapshots (spec 12): one reviewed file per feature.
insta = "1.49.0"
kurbo = "0.13.1"
proptest = "1.12.0"
rfd = "0.17.2"
skrifa = { version = "0.44.0", default-features = false, features = ["std"] }
resvg = { version = "0.48.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
# `float_roundtrip`: numbers load as the nearest f64, so load → save never
# moves one (found by the `vxtr_load` fuzzer, spec 13).
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
thiserror = "2.0.21"
# SVG import (spec 13): normalises any SVG to groups, paths and paints;
# `text` keeps <text> as text and gives outlines when it cannot stay text.
# No system-fonts feature: fonts come from our own `FontDb`.
usvg = { version = "0.48.1", default-features = false, features = ["text"] }
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

# Dependencies (tiny-skia, egui, …) are optimised even in debug builds, so
# `cargo run` draws at a usable speed; workspace crates stay debuggable.
# No debug info for dependencies (spec 14 §6): the build folder is much
# smaller and nobody steps into egui or usvg; our own crates keep theirs.
[profile.dev.package."*"]
opt-level = 2
debug = false

# Small release binary (spec 14 §6): one codegen unit and full LTO let the
# linker drop more; no debug symbols are shipped. `panic` stays `unwind`: a
# panic inside the import or save thread must fail only that job.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
