[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
vextor-core = { path = "crates/vextor-core" }
vextor-geom = { path = "crates/vextor-geom" }
vextor-svg = { path = "crates/vextor-svg" }
vextor-render = { path = "crates/vextor-render" }
eframe = "0.37.0"
base64 = "0.23.1"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
directories = "6.0.0"
# Text (spec 05c): the versions usvg 0.48 uses, so nothing is duplicated.
fontdb = { version = "0.24.0", default-features = false, features = ["std", "fs"] }
harfrust = "0.12.0"
# Booleans (spec 11 spike): robust polygon overlay; curves are recovered
# from the inputs afterwards (`vextor-geom` `ops`).
i_overlay = { version = "9.1.0", default-features = false }
kurbo = "0.13.1"
proptest = "1.12.0"
rfd = "0.17.2"
skrifa = { version = "0.44.0", default-features = false, features = ["std"] }
resvg = { version = "0.48.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

# Dependencies (tiny-skia, egui, …) are optimised even in debug builds, so
# `cargo run` draws at a usable speed; workspace crates stay debuggable.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
