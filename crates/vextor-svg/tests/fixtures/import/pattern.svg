<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#eef"/>
      <circle cx="5" cy="5" r="2" fill="#33f"/>
    </pattern>
    <pattern id="stripes" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="4" height="8" fill="url(#dots)"/>
    </pattern>
  </defs>
  <rect width="100" height="50" fill="url(#dots)"/>
  <rect y="50" width="100" height="50" fill="url(#stripes)" stroke="url(#dots)" stroke-width="3"/>
</svg>
