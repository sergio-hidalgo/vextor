<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <clipPath id="round"><circle cx="50" cy="50" r="30"/></clipPath>
    <clipPath id="two"><rect x="0" y="0" width="20" height="20"/><rect x="10" y="10" width="20" height="20"/></clipPath>
  </defs>
  <g id="badge" opacity="0.5">
    <rect width="100" height="100" fill="#ddd"/>
    <g id="inner" transform="rotate(30 50 50)">
      <rect x="30" y="30" width="40" height="40" fill="#08f"/>
      <rect x="40" y="40" width="20" height="20" fill="#fff"/>
    </g>
  </g>
  <g id="clipped" clip-path="url(#round)">
    <rect width="100" height="50" fill="#e33"/>
    <rect y="50" width="100" height="50" fill="#33e"/>
  </g>
  <g clip-path="url(#two)">
    <rect width="40" height="40" fill="#0a0"/>
  </g>
  <g><g><rect x="80" y="80" width="10" height="10"/></g></g>
</svg>
