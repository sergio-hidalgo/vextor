<!-- The .vxtr document icon (spec 13c), drawn from the owner's mock: a
     white page with a folded top-right corner, an open amber frame that
     leaves the fold free, and the logo of icon.svg in amber. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- soft shadow under the page -->
  <path d="M232 100H664L824 260V908q0 32-32 32H232q-32 0-32-32V132q0-32 32-32z" fill="#000" fill-opacity=".14"/>
  <!-- the page -->
  <path d="M232 88H664L824 248V896q0 32-32 32H232q-32 0-32-32V120q0-32 32-32z" fill="#f6f6f6" stroke="#cfcfcf" stroke-width="4"/>
  <!-- the folded corner -->
  <path d="M664 88V216q0 32 32 32H824z" fill="#e3e3e3" stroke="#cfcfcf" stroke-width="4" stroke-linejoin="round"/>
  <!-- the open frame: from under the fold round to the fold's edge -->
  <path d="M760 312V852H264V164H616" fill="none" stroke="#dca500" stroke-width="30"/>
  <!-- the logo (icon.svg's "O" and node line), centred on the page -->
  <g transform="translate(512 512) scale(4.6) translate(-63.78 -63.78)" fill="#dca500" stroke="#dca500">
