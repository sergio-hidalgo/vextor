[package]
name = "vextor-render"
description = "Vextor document rasteriser for the canvas"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
vextor-core.workspace = true
vextor-geom.workspace = true
kurbo.workspace = true
thiserror.workspace = true
image.workspace = true
# `png-format`: PNG export of artboards (spec 12); `png` is already in the
# tree through resvg.
tiny-skia = { workspace = true, features = ["png-format"] }

[dev-dependencies]
criterion.workspace = true
# `text`: the text reference renders (tests only; fonts loaded explicitly).
resvg = { workspace = true, features = ["text"] }
# Exported SVG renders like the canvas (spec 12 render comparison).
vextor-svg.workspace = true

[[bench]]
name = "render"
harness = false

[lints]
workspace = true
