# cargo-deny: run `cargo deny check` (security-check skill §1)

[graph]
all-features = false

[advisories]
# RustSec advisory DB; any vulnerability fails, unmaintained crates are reported
version = 2
yanked = "deny"
# Unmaintained (not vulnerable) crates pulled in transitively by eframe 0.37;
# Linux-only (AT-SPI accessibility, Wayland window decorations). Each ignore
# is revisited when eframe is upgraded.
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser via winit/sctk-adwaita (Wayland decorations); eframe-owned" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names via accesskit_unix (Linux a11y); eframe-owned" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant via accesskit_unix (Linux a11y); eframe-owned" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive via accesskit_unix (Linux a11y); eframe-owned" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "BSL-1.0",          # arboard, error-code (system clipboard)
    "OFL-1.1",          # epaint_default_fonts: bundled UI fonts
    "Ubuntu-font-1.0",  # epaint_default_fonts: bundled UI fonts
]

[licenses.private]
# our own crates are publish = false and carry no license yet
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
